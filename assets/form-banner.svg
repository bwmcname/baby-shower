<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CFE4F3" stroke-width="1.5"/>
    </pattern>
    <clipPath id="rbf"><circle cx="0" cy="0" r="62"/></clipPath>
  </defs>
  <rect width="1600" height="400" fill="#E6F2FB"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <g stroke="#2F6F9F" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Erlenmeyer flask -->
    <g transform="translate(250 345) scale(1.35)">
      <path d="M-45 -30 L-75 -8 Q-80 0 -70 0 L70 0 Q80 0 75 -8 L45 -30 Z" fill="#7CC6E8" stroke="none"/>
      <path d="M-18 -110 L-18 -50 L-75 -8 Q-80 0 -70 0 L70 0 Q80 0 75 -8 L18 -50 L18 -110" fill="none"/>
      <path d="M-26 -112 H26" fill="none"/>
      <path d="M-45 -30 H45" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".7"/>
    </g>

    <!-- Test tube rack -->
    <g transform="translate(560 345)">
      <g transform="translate(-70 0)">
        <path d="M14 -14 A14 14 0 0 1 -14 -14 V-80 H14 Z" fill="#9ADBC5" stroke="none"/>
        <path d="M-14 -170 V-14 A14 14 0 0 0 14 -14 V-170" fill="none"/>
      </g>
      <g>
        <path d="M14 -14 A14 14 0 0 1 -14 -14 V-110 H14 Z" fill="#7CC6E8" stroke="none"/>
        <path d="M-14 -170 V-14 A14 14 0 0 0 14 -14 V-170" fill="none"/>
      </g>
      <g transform="translate(70 0)">
        <path d="M14 -14 A14 14 0 0 1 -14 -14 V-60 H14 Z" fill="#F4D77E" stroke="none"/>
        <path d="M-14 -170 V-14 A14 14 0 0 0 14 -14 V-170" fill="none"/>
      </g>
      <rect x="-115" y="-120" width="230" height="16" rx="4" fill="#FFFFFF"/>
      <path d="M-105 -104 V10 M105 -104 V10 M-120 10 H120" fill="none"/>
    </g>

    <!-- Molecule -->
    <g transform="translate(870 190)" fill="none" stroke-width="5">
      <polygon points="40,0 20,34.6 -20,34.6 -40,0 -20,-34.6 20,-34.6"/>
      <polygon transform="translate(60 34.6)" points="40,0 20,34.6 -20,34.6 -40,0 -20,-34.6 20,-34.6"/>
      <path d="M100 34.6 L150 5"/>
      <circle cx="160" cy="0" r="12" fill="#F4D77E"/>
      <path d="M-40 0 L-85 -30"/>
      <circle cx="-95" cy="-36" r="12" fill="#9ADBC5"/>
      <circle cx="20" cy="-34.6" r="7" fill="#2F6F9F" stroke="none"/>
      <circle cx="80" cy="69.2" r="7" fill="#2F6F9F" stroke="none"/>
    </g>

    <!-- Round-bottom flask -->
    <g transform="translate(1310 285)">
      <rect x="-80" y="0" width="160" height="80" fill="#9ADBC5" stroke="none" clip-path="url(#rbf)"/>
      <path d="M-16 -150 V-60 A62 62 0 1 0 16 -60 V-150" fill="none"/>
      <path d="M-24 -152 H24" fill="none"/>
      <path d="M-58 0 H58" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".7"/>
    </g>

    <!-- Beaker -->
    <g transform="translate(1500 345)">
      <path d="M-45 -50 H45 V-8 Q45 0 37 0 H-37 Q-45 0 -45 -8 Z" fill="#7CC6E8" stroke="none"/>
      <path d="M-55 -130 L-45 -122 V-8 Q-45 0 -37 0 H37 Q45 0 45 -8 V-130" fill="none"/>
      <path d="M-45 -100 H-25 M-45 -75 H-30 M-45 -50 H-25" fill="none" stroke-width="3"/>
    </g>
  </g>

  <!-- Bubbles -->
  <g fill="none" stroke="#5FA7D4" stroke-width="3">
    <circle cx="250" cy="150" r="10"/>
    <circle cx="275" cy="112" r="7"/>
    <circle cx="238" cy="80" r="5"/>
    <circle cx="560" cy="120" r="7"/>
    <circle cx="545" cy="90" r="4"/>
    <circle cx="1310" cy="100" r="9"/>
    <circle cx="1330" cy="66" r="6"/>
    <circle cx="1295" cy="42" r="4"/>
    <circle cx="1500" cy="175" r="6"/>
    <circle cx="1080" cy="300" r="8"/>
    <circle cx="700" cy="90" r="5"/>
    <circle cx="1120" cy="120" r="5"/>
  </g>
</svg>
